<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalcPro · Professional Calculator</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Animated Background Orbs -->
    <div class="bg-orb"></div>
    <div class="bg-orb"></div>
    <div class="bg-orb"></div>

    <div class="calculator">
        
        <!-- Header -->
        <div class="calc-header">
            <span class="calc-brand">
                <i class="fas fa-calculator"></i> CalcPro
            </span>
            <div class="calc-mode">
                <div class="mode-dot"></div>
                <div class="mode-dot"></div>
                <div class="mode-dot"></div>
            </div>
        </div>

        <!-- Display -->
        <div class="display-wrapper">
            <div class="history-text" id="history"></div>
            <input type="text" id="display" value="0" readonly>
        </div>

        <!-- Buttons -->
        <div class="buttons">
            <button class="operator clear-btn" onclick="clearDisplay()">
                <span>AC</span>
            </button>
            <button class="operator" onclick="deleteLast()">
                <i class="fas fa-delete-left"></i>
            </button>
            <button class="operator" onclick="appendValue('%')">%</button>
            <button class="operator" onclick="appendValue('/')">÷</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('*')">×</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="operator" onclick="appendValue('-')">−</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button class="operator" onclick="appendValue('+')">+</button>

            <button class="zero" onclick="appendValue('0')">0</button>
            <button onclick="appendValue('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>
        </div>

        <!-- Footer indicator -->
        <div class="calc-footer">
            <span></span>
            <span></span>
            <span></span>
        </div>

    </div>

    <!-- External JavaScript -->
    <script src="script.js"></script>
</body>
</html>
